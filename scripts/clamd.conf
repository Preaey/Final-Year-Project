# Copy to ClamAV's configuration directory and set DatabaseDirectory to match freshclam.conf.
# Use an administrator-controlled database directory readable by the clamd service account.
DatabaseDirectory "C:\Program Files\ClamAV\database"
TCPAddr 127.0.0.1
TCPSocket 3310
StreamMaxLength 64M
MaxFileSize 64M
MaxScanSize 256M
MaxRecursion 16
AlertExceedsMax yes
AlertEncrypted yes
FailIfCvdOlderThan 7
